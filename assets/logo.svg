<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none" class="h-10 w-auto">
  <defs>
    <linearGradient id="retainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon: Retain Spark & Growth Nodes -->
  <g transform="translate(6, 6)">
    <!-- Rounded Container -->
    <rect x="4" y="4" width="40" height="40" rx="14" fill="#0F172A" />
    <!-- Dynamic Growth Spark & Nodes with Retain Gradient Accent -->
    <path d="M14 31 L21 24 L27 28 L34 17" stroke="url(#retainGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 17 H34 V23" stroke="url(#retainGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="14" cy="31" r="2.5" fill="#EF4444" />
    <circle cx="21" cy="24" r="2.5" fill="#F43F5E" />
    <circle cx="27" cy="28" r="2.5" fill="#FB923C" />
    <circle cx="34" cy="17" r="3" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <text x="62" y="38" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="27" font-weight="900" fill="#0F172A" letter-spacing="-0.8">
    Retain<tspan fill="#EF4444">.</tspan>
  </text>
  <rect x="175" y="20" width="88" height="22" rx="11" fill="url(#retainGrad)" />
  <text x="219" y="35" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">GROWTH</text>
</svg>
