<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Center &bull; Retain Social Growth Challenge</title>
  <meta name="description" content="Authorized administrator control center for reviewing referral submissions, editing social links, managing points, and tracking analytics.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            retain: {
              red: '#EF4444',
              crimson: '#E11D48',
              rose: '#F43F5E',
              orange: '#FB923C',
              sunset: '#F97316',
            },
            cream: {
              50: '#FFFFFF',
              100: '#FAFBF7',
              200: '#F4F6EE',
              300: '#EAEFE6',
              400: '#E2E8F0',
            },
            charcoal: {
              800: '#1E293B',
              900: '#0F172A',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Firebase App & Firestore Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- React 18 & ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- HTM Tagged Template Compiler for React (Zero Build Step, Native ESM) -->
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#FAFBF7] text-slate-900 min-h-screen flex flex-col selection:bg-rose-500 selection:text-white">

  <!-- Navigation Header -->
  <header class="sticky top-0 z-40 bg-[#FAFBF7]/90 backdrop-blur-md border-b border-slate-200/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Brand Logo & Title -->
        <a href="admin.html" class="flex items-center gap-3 group">
          <div class="w-10 h-10 rounded-2xl bg-slate-900 flex items-center justify-center text-white shadow-sm group-hover:scale-105 transition-transform">
            <i data-lucide="shield-check" class="w-5 h-5 text-rose-500"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xl font-black tracking-tight text-slate-900">Retain<span class="text-rose-600">.</span></span>
              <span class="text-[10px] font-black px-2.5 py-0.5 rounded-full bg-slate-900 text-white uppercase tracking-wider">Admin</span>
            </div>
            <span class="text-[11px] font-semibold text-slate-500 block -mt-0.5">Control Center & Audit</span>
          </div>
        </a>

        <!-- Navigation Links -->
        <div class="flex items-center gap-4">
          <a href="campaign.html" class="hidden md:flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-950 transition-colors">
            <i data-lucide="info" class="w-3.5 h-3.5 text-slate-500"></i>
            <span>Campaign</span>
          </a>
          <a href="follow.html" target="_blank" class="hidden md:flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-950 transition-colors">
            <i data-lucide="globe" class="w-3.5 h-3.5 text-slate-500"></i>
            <span>Follower Page</span>
          </a>
          <a href="employee.html" class="hidden md:flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-950 transition-colors">
            <i data-lucide="user" class="w-3.5 h-3.5 text-slate-500"></i>
            <span>Employee Hub</span>
          </a>
        </div>

      </div>
    </div>
  </header>

  <!-- React Root Container for Admin Portal -->
  <main id="admin-react-root" class="flex-grow flex flex-col justify-center min-w-0"></main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 bg-[#FAFBF7] text-slate-500 text-xs py-10 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-900">Retain Social Growth Challenge</span>
        <span>&bull; Authorized Administrator Portal</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="follow.html" target="_blank" class="hover:text-slate-900 transition-colors">Follower Landing Page</a>
        <a href="employee.html" class="hover:text-slate-900 transition-colors">Employee Portal</a>
      </div>
      <div class="text-slate-400 text-[11px]">
        &copy; 2026 Retain. Confidential & Internal Use Only.
      </div>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-sm"></div>

  <!-- Global Toast Notification Helper -->
  <script>
    window.showToast = function(message, type = 'info') {
      const toastContainer = document.getElementById('toast-container');
      if (!toastContainer) return;

      const toast = document.createElement('div');
      const typeStyles = {
        success: 'bg-slate-900 border-slate-800 text-white',
        error: 'bg-rose-900 border-rose-800 text-white',
        info: 'bg-slate-900 border-slate-800 text-white',
        warning: 'bg-amber-900 border-amber-800 text-white'
      };

      const icons = {
        success: 'check-circle',
        error: 'alert-circle',
        info: 'info',
        warning: 'alert-triangle'
      };

      toast.className = `flex items-center gap-3 px-4 py-3 rounded-2xl border shadow-xl backdrop-blur-md text-xs font-bold animate-slide-up ${typeStyles[type] || typeStyles.info}`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 text-rose-400 flex-shrink-0"></i>
        <span>${message}</span>
      `;

      toastContainer.appendChild(toast);
      if (window.lucide) window.lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    };
  </script>

  <!-- React 18 Admin Portal Application Module (Native Browser ESM) -->
  <script type="module" src="js/admin/index.js"></script>
</body>
</html>
